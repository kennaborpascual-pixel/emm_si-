<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Maria 🌿</title>
    <style>
        :root {
            --bg-color: #f4f1ea;
            --primary-color: #556b2f;
            --text-color: #3e3e3e;
            --paper-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #auth-screen {
            text-align: center;
            z-index: 100;
        }

        .auth-btn {
            padding: 12px 35px;
            margin: 10px;
            border: 2px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
            cursor: pointer;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        .auth-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        #envelope-screen {
            display: none;
            perspective: 1000px;
            cursor: pointer;
        }

        .envelope {
            width: 320px;
            height: 220px;
            background: #d4ccb6;
            position: relative;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #c4b99e;
            transform-origin: top;
            transition: transform 0.6s;
            z-index: 5;
        }

        .envelope.open::before {
            transform: rotateX(180deg);
        }

        .heart-seal {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            z-index: 6;
        }

        #content-screen {
            display: none;
            width: 95%;
            max-width: 800px;
            background: var(--paper-color);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            opacity: 0;
            transition: opacity 1s;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* GALERÍA HORIZONTAL */
        .photo-gallery {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
            /* Para que en móviles se ajusten si no caben */
        }

        .photo-card {
            flex: 1;
            min-width: 250px;
            max-width: 350px;
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            /* Tamaño moderado */
            object-fit: contain;
            /* SE VE TODA LA IMAGEN SIN RECORTAR */
            background-color: #f9f9f9;
            /* Fondo suave para fotos que no llenen el cuadro */
            border-radius: 5px;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btns-container {
            height: 100px;
            position: relative;
            margin-top: 20px;
        }

        #yesBtn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        #noBtn {
            background: #eee;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            position: absolute;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mpeg">
    </audio>

    <div id="auth-screen">
        <h1>Identifícate...</h1>
        <p>¿Eres Maria?</p>
        <button class="auth-btn" onclick="checkUser(true)">Sí, soy yo</button>
        <button class="auth-btn" onclick="checkUser(false)">No</button>
    </div>

    <div id="envelope-screen" onclick="openLetter()">
        <div class="envelope" id="envElement">
            <div class="heart-seal">🌿</div>
        </div>
        <p style="text-align: center; color: var(--primary-color); margin-top: 25px;">Toca la carta para abrirla</p>
    </div>

    <div id="content-screen">
        <h1 style="color: var(--primary-color);">Hola</h1>
        <p>Esta semana ha sido pesado para los dos, tu pudiendo con todo y sobreviviendo, tal vez la semana acabo
            conmigo en lugar de yo acabar la semana y me preguntaba si ...</p>

        <div class="photo-gallery">
            <div class="photo-card">
                <img src="margaritas.jpg" alt="Bosque">
            </div>
            <div class="photo-card">
                <img src="andre.jpg" alt="Montaña">
            </div>
        </div>

        <h3>¿Me acompañarías a desconectarnos? si? si?</h3>

        <div class="btns-container">
            <button id="yesBtn" onclick="accept()">¡Claro que sí! 🥾</button>
            <button id="noBtn">No puedo...</button>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');

        function checkUser(isMaria) {
            if (isMaria) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('envelope-screen').style.display = 'block';
                bgMusic.play().catch(e => console.log("Audio activo"));
            } else {
                alert("Esta invitación es privada.");
            }
        }

        function openLetter() {
            const env = document.getElementById('envElement');
            env.classList.add('open');
            setTimeout(() => {
                document.getElementById('envelope-screen').classList.add('hidden');
                const content = document.getElementById('content-screen');
                content.style.display = 'block';
                setTimeout(() => content.style.opacity = 1, 50);
            }, 800);
        }

        const noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        function accept() {
            alert("WOOOW perfecto... sabia que dirías que si... me mandas una captura si? :)");
        }
    </script>
</body>

</html>
